name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/TubeViet.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TubeViet-apk
          path: out/TubeViet.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/TubeViet.apk \
            --title "TubeViet bản mới nhất (build ${{ github.run_number }})" \
            --notes "Tải file TubeViet.apk bên dưới về điện thoại Android 8 trở lên để cài."
